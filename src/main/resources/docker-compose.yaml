version: "3.9"
services:
  database:
    image: mongo:4.4
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=my_teller
      - MONGO_INITDB_ROOT_PASSWORD=Teller2025
      - MONGO_INITDB_DATABASE=my_teller
      - MONGO_INITDB_USERNAME=my_teller
      - MONGO_INITDB_PASSWORD=Teller2025
    volumes:
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
      - ./db:/data/db